{% extends "base.html" %}
{% block title %}Create account · Google Clone{% endblock %}
{% block content %}
<main class="auth-main">
  <section class="auth-card">
    <div class="wordmark auth-wordmark"><span class="c-blue">G</span><span class="c-red">o</span><span class="c-yellow">o</span><span class="c-blue">g</span><span class="c-green">l</span><span class="c-red">e</span></div>
    <h1>Create your account</h1><p class="subtle">Your own account for this demo app</p>
    <form method="post" class="auth-form">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" minlength="3" maxlength="30" required>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
      <label for="password">Password (at least 8 characters)</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <label for="confirm_password">Confirm password</label>
      <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>
      <div class="auth-bottom"><a href="{{ url_for('login') }}">Already have an account?</a><button class="button button-blue" type="submit">Create account</button></div>
    </form>
  </section>
</main>
{% endblock %}
